<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Демо Production Numeric Safety Guard | SHAR Production</title>
    <meta name="description" content="Интерактивная проверка конечности чисел в runtime от SHAR Production.">
    <link rel="canonical" href="https://sharproduction.github.io/production-numeric-safety-guard/ru/">
    <link rel="alternate" hreflang="en" href="https://sharproduction.github.io/production-numeric-safety-guard/">
    <link rel="alternate" hreflang="ru" href="https://sharproduction.github.io/production-numeric-safety-guard/ru/">
    <link rel="alternate" hreflang="x-default" href="https://sharproduction.github.io/production-numeric-safety-guard/">
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #101216; color: #f2f5f8; }
      body { margin: 0; line-height: 1.5; } main { max-width: 760px; margin: auto; padding: 48px 20px; }
      h1 { line-height: 1.1; } .card { background: #1b1f27; border: 1px solid #343b48; border-radius: 12px; padding: 20px; margin-top: 24px; }
      label { display: block; margin: 14px 0; } input { margin-left: 8px; width: 7rem; } button { padding: 9px 14px; cursor: pointer; }
      output { display: block; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 16px; padding: 12px; background: #0c0f14; border-radius: 8px; }
      a { color: #91caff; } .ok { color: #8ae6a0; } .bad { color: #ffadad; }
    </style>
  </head>
  <body>
    <main>
      <p><a href="https://sharprod.com/">SHAR Production</a> · AI-hybrid video production studio · <a href="../">English</a></p>
      <h1>Production Numeric Safety Guard</h1>
      <p>Запустите dependency-free проверку на небольшом runtime-примере расчёта для производства. Данные не загружаются и не сохраняются.</p>
      <section class="card" aria-labelledby="demo-title">
        <h2 id="demo-title">Runtime-демо</h2>
        <label>Длительность, сек. <input id="duration" type="number" value="12.5" step="0.1"></label>
        <label>Усиление дорожки, dB <input id="gain" type="number" value="-3" step="0.1"></label>
        <label><input id="inject" type="checkbox"> Добавить вложенный Infinity для теста блокировки</label>
        <button id="run" type="button">Запустить проверку</button>
        <output id="result" aria-live="polite">Готово.</output>
      </section>
      <p>Исходный код и лицензия MIT: <a href="https://github.com/SHARProduction/production-numeric-safety-guard">GitHub repository</a>.</p>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
