<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Production Numeric Safety Guard Demo | SHAR Production</title>
    <meta name="description" content="Interactive runtime finite-number preflight demo by SHAR Production.">
    <link rel="canonical" href="https://sharproduction.github.io/production-numeric-safety-guard/">
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #101216; color: #f2f5f8; }
      body { margin: 0; line-height: 1.5; } main { max-width: 760px; margin: auto; padding: 48px 20px; }
      h1 { line-height: 1.1; } .card { background: #1b1f27; border: 1px solid #343b48; border-radius: 12px; padding: 20px; margin-top: 24px; }
      label { display: block; margin: 14px 0; } input { margin-left: 8px; width: 7rem; } button { padding: 9px 14px; cursor: pointer; }
      output { display: block; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 16px; padding: 12px; background: #0c0f14; border-radius: 8px; }
      a { color: #91caff; } .ok { color: #8ae6a0; } .bad { color: #ffadad; }
    </style>
  </head>
  <body>
    <main>
      <p><a href="https://sharprod.com/">SHAR Production</a> · AI-hybrid video production studio</p>
      <h1>Production Numeric Safety Guard</h1>
      <p>Run the dependency-free preflight against a small in-memory production-calculation example. It does not upload or store data.</p>
      <section class="card" aria-labelledby="demo-title">
        <h2 id="demo-title">Runtime demo</h2>
        <label>Duration seconds <input id="duration" type="number" value="12.5" step="0.1"></label>
        <label>Track gain dB <input id="gain" type="number" value="-3" step="0.1"></label>
        <label><input id="inject" type="checkbox"> Inject nested Infinity for a rejection test</label>
        <button id="run" type="button">Run preflight</button>
        <output id="result" aria-live="polite">Ready.</output>
      </section>
      <p>Source and MIT license: <a href="https://github.com/SHARProduction/production-numeric-safety-guard">GitHub repository</a>.</p>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
