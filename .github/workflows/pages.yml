name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "src/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runtime guard
        run: node --test
      - uses: actions/configure-pages@v5
      - name: Stage the tested runtime module with the static demo
        run: cp src/index.mjs docs/core.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
